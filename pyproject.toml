[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lining-port-dynamics"
version = "0.2.0"
description = "Passive bridge synthesis at fixed strain sensor locations"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy", "scipy", "openseespy", "scikit-learn", "PyYAML", "threadpoolctl"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
