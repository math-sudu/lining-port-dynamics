[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lining-port-dynamics"
version = "0.1.0"
description = "Reproducible finite-element to four-port dynamics pilot"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy", "scipy", "openseespy", "scikit-learn", "PyYAML", "torch", "ncps", "psutil"]

[project.scripts]
lining-pilot = "lining_port.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
